  <style>
    :root{--navy:#07182f;--blue:#1477ff;--cyan:#78dcff;--paper:#f4f9ff;--ink:#11223e;--muted:#6d7f98;--line:#d8e8f8;--white:#fff;--danger:#d94b66;--shadow:0 20px 55px rgba(12,61,118,.13)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(22px,calc((100% - 1180px)/2));border-bottom:1px solid rgba(216,232,248,.85);background:rgba(244,249,255,.88);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;color:var(--navy);font-weight:900}.brand i{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;color:#fff;background:linear-gradient(145deg,#76dcff,#126ce0 70%,#093d86);font-style:normal}.top-actions,.album-tabs,.hero-actions{display:flex;flex-wrap:wrap;gap:9px}.btn{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:13px;color:#24517d;background:#fff;font-weight:750}.btn:hover{border-color:#8fc9ff;transform:translateY(-1px)}.btn.primary{color:#fff;border-color:#1678e9;background:linear-gradient(135deg,#1176ed,#0758b9)}.btn.danger{color:var(--danger)}.shell{width:min(1180px,calc(100% - 34px));margin:auto}.hero{position:relative;overflow:hidden;margin-top:28px;padding:54px;border-radius:31px;color:#fff;background:radial-gradient(circle at 80% 18%,rgba(104,220,255,.33),transparent 28%),linear-gradient(135deg,#06152e,#0a3976 64%,#0877bc);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-70px;bottom:-125px;width:330px;height:330px;border:42px solid rgba(255,255,255,.07);border-radius:50%}.eyebrow{margin:0 0 13px;color:#9be7ff;font-size:12px;font-weight:800;letter-spacing:.2em}.hero h1{margin:0;font-size:clamp(38px,6vw,68px);letter-spacing:-.055em}.hero p{max-width:590px;margin:18px 0 27px;color:rgba(255,255,255,.72);line-height:1.8}.hero-actions{position:relative;z-index:1}.hero .btn{border-color:rgba(255,255,255,.23);color:#fff;background:rgba(255,255,255,.09)}.hero .btn.primary{color:#0a457e;background:#fff}.section{padding:45px 0 80px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.section-head h2{margin:0;font-size:32px}.section-head p{margin:7px 0 0;color:var(--muted)}.album-tabs{margin:18px 0}.tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:#4b6685;background:#fff}.tab.active{color:#fff;border-color:#1677ea;background:#1677ea}.empty{display:grid;place-items:center;min-height:330px;padding:38px;border:1px dashed #b9d7f3;border-radius:26px;text-align:center;background:rgba(255,255,255,.65)}.empty-icon{font-size:55px}.empty h3{margin:15px 0 7px}.empty p{margin:0;color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.photo{position:relative;aspect-ratio:1;overflow:hidden;border-radius:20px;background:#dcecff;box-shadow:0 8px 24px rgba(23,78,137,.08)}.photo img{width:100%;height:100%;object-fit:cover;transition:.28s}.photo:hover img{transform:scale(1.035)}.photo-info{position:absolute;inset:auto 0 0;padding:34px 13px 12px;color:#fff;background:linear-gradient(transparent,rgba(2,20,48,.75));font-size:12px;opacity:0;transition:.2s}.photo:hover .photo-info{opacity:1}.photo-delete{position:absolute;top:9px;right:9px;width:34px;height:34px;border:0;border-radius:11px;color:#fff;background:rgba(4,25,57,.6);backdrop-filter:blur(8px);opacity:0}.photo:hover .photo-delete{opacity:1}.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 70% 20%,#176dba,#07182f 58%)}.gate-card{width:min(430px,100%);padding:38px;border:1px solid rgba(255,255,255,.15);border-radius:29px;color:#fff;background:rgba(6,30,67,.72);box-shadow:0 30px 80px rgba(0,0,0,.28);backdrop-filter:blur(20px)}.gate-star{display:grid;place-items:center;width:68px;height:68px;margin-bottom:22px;border-radius:22px;background:linear-gradient(145deg,#7ce0ff,#126ede);font-size:34px}.gate h1{margin:0 0 10px;font-size:34px}.gate p{color:rgba(255,255,255,.66);line-height:1.7}.field{width:100%;height:49px;margin:12px 0;padding:0 15px;border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;outline:0;background:rgba(255,255,255,.09)}.field:focus{border-color:#76d8ff}.gate .btn{width:100%;margin-top:5px}.message{min-height:20px;color:#ffb9c6;font-size:13px}.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(3,18,40,.78);backdrop-filter:blur(10px)}.modal img{max-width:min(1100px,94vw);max-height:84vh;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.4)}.modal-close{position:fixed;top:22px;right:25px;width:45px;height:45px;border:1px solid rgba(255,255,255,.25);border-radius:15px;color:#fff;background:rgba(255,255,255,.1);font-size:24px}.toast{position:fixed;left:50%;bottom:25px;z-index:120;transform:translate(-50%,20px);padding:12px 17px;border-radius:12px;color:#fff;background:#082852;opacity:0;pointer-events:none;transition:.22s}.toast.show{transform:translate(-50%,0);opacity:1}.note{margin-top:22px;padding:16px 19px;border:1px solid #d9e9f8;border-radius:16px;color:#607792;background:#fff;font-size:13px;line-height:1.7}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.topbar{align-items:flex-start}.top-actions .btn:not(.primary){display:none}.hero{padding:38px 25px}.section-head{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.photo{border-radius:14px}.photo-delete{opacity:1}.gate-card{padding:29px}}
    .gate{overflow:hidden;background:radial-gradient(circle at 20% 22%,rgba(65,184,255,.42),transparent 28%),radial-gradient(circle at 82% 76%,rgba(114,220,255,.24),transparent 30%),linear-gradient(145deg,#041126,#08376f 58%,#0872aa)}.gate:before,.gate:after{content:"✦";position:absolute;color:rgba(190,241,255,.55);font-size:50px;animation:floatStar 4s ease-in-out infinite alternate}.gate:before{left:12%;top:16%}.gate:after{right:13%;bottom:14%;font-size:33px;animation-delay:-2s}.gate-card{position:relative;width:min(450px,100%);padding:42px;border-color:rgba(255,255,255,.22);border-radius:32px;background:linear-gradient(145deg,rgba(8,39,83,.82),rgba(11,74,129,.58));box-shadow:0 35px 100px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.14)}.gate-card:after{content:"愿每一段回忆，都被温柔收藏";display:block;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);color:#9ddfff;text-align:center;font-size:12px;letter-spacing:.08em}.gate-star{width:72px;height:72px;border-radius:24px;box-shadow:0 13px 32px rgba(30,153,239,.34);animation:starBreathe 2.8s ease-in-out infinite}.cute-alert{position:fixed;left:50%;top:50%;z-index:140;width:min(360px,calc(100% - 38px));padding:27px 25px;border:1px solid #b8e5ff;border-radius:25px;color:#244f78;background:linear-gradient(145deg,#fff,#eaf7ff);box-shadow:0 28px 90px rgba(0,27,69,.38);text-align:center;opacity:0;pointer-events:none}.cute-alert.show{animation:cutePop 2.3s ease both}.cute-face{font-size:43px}.cute-alert strong{display:block;margin:8px 0 5px;color:#1768b4;font-size:20px}.cute-alert span{color:#7792aa;font-size:13px}@keyframes cutePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65) rotate(-5deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(3deg)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%{transform:translate(-52%,-50%) rotate(-2deg)}87%{transform:translate(-48%,-50%) rotate(2deg)}100%{opacity:0;transform:translate(-50%,-55%) scale(.92)}}@keyframes floatStar{to{transform:translateY(-18px) rotate(15deg);opacity:.9}}@keyframes starBreathe{50%{transform:translateY(-5px) scale(1.06);filter:brightness(1.15)}}
  </style>
<style id="rich-hero-style">.hero-rich{display:grid;grid-template-columns:1fr .9fr;align-items:center;min-height:470px;padding:62px 64px;background:radial-gradient(circle at 78% 24%,rgba(99,218,255,.24),transparent 24%),radial-gradient(circle at 22% 110%,rgba(29,120,234,.32),transparent 38%),linear-gradient(135deg,#06152e 0%,#0a3269 55%,#0874ae 100%)}.hero-copy{position:relative;z-index:4}.hero-rich h1{font-size:clamp(54px,7vw,82px);line-height:1.08}.hero-rich h1 em{color:#fff;font-style:normal;text-shadow:0 0 35px rgba(106,218,255,.26)}.hero-rich .hero-actions{margin-top:40px}.memory-scene{position:relative;z-index:2;min-height:350px}.memory-glow{position:absolute;left:50%;top:48%;width:310px;height:310px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(114,222,255,.28),rgba(37,130,230,.12) 48%,transparent 70%);animation:gentlePulse 4.5s ease-in-out infinite}.memory-orb{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:200px;height:200px;transform:translate(-50%,-50%);border:1px solid rgba(190,239,255,.38);border-radius:50%;background:radial-gradient(circle at 35% 28%,#b9f1ff,#2b9df0 34%,#0b57af 70%,#07357c);box-shadow:0 24px 60px rgba(0,30,86,.34),inset -25px -30px 45px rgba(0,25,75,.3);animation:gentleFloat 4.2s ease-in-out infinite}.memory-orb:before{content:"";position:absolute;inset:-25px;border:1px solid rgba(167,229,255,.2);border-radius:50%}.memory-orb span{font-family:STXingkai,"华文行楷",KaiTi,serif;font-size:72px;text-shadow:0 5px 20px rgba(0,31,88,.25)}.memory-orb small{position:absolute;bottom:32px;color:#c9f2ff;font-size:9px;font-weight:800;letter-spacing:.28em}.mini-card{position:absolute;width:145px;height:100px;padding:18px;border:1px solid rgba(255,255,255,.28);border-radius:20px;color:#154c80;background:rgba(255,255,255,.9);box-shadow:0 18px 38px rgba(0,27,70,.22);animation:gentleFloat 4.8s ease-in-out infinite}.mini-card b{display:block;font-size:14px}.mini-card i{display:block;margin-top:12px;color:#2c98e8;font-size:25px;font-style:normal}.card-a{left:2%;top:12%;animation-delay:-1.3s}.card-b{right:0;bottom:8%;animation-delay:-2.7s}.hero-sparks i{position:absolute;color:#c8f3ff;font-style:normal;text-shadow:0 0 12px #64d3ff;animation:sparkFade 3.5s ease-in-out infinite}.hero-sparks i:nth-child(1){left:48%;top:15%}.hero-sparks i:nth-child(2){left:64%;top:8%;animation-delay:-1s}.hero-sparks i:nth-child(3){right:7%;top:22%;animation-delay:-2s}.hero-sparks i:nth-child(4){right:31%;bottom:11%;animation-delay:-.5s}.album-section{padding-top:30px}.album-section .album-tabs{margin-top:0}@keyframes gentleFloat{0%,100%{margin-top:0}50%{margin-top:-11px}}@keyframes gentlePulse{0%,100%{opacity:.68;scale:.96}50%{opacity:1;scale:1.05}}@keyframes sparkFade{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-10px)}}@media(max-width:780px){.hero-rich{grid-template-columns:1fr;min-height:620px;padding:45px 27px}.memory-scene{min-height:280px}.memory-orb{width:165px;height:165px}.memory-orb span{font-size:58px}.mini-card{width:125px;height:88px;padding:14px}.hero-rich h1{font-size:52px}.hero-rich .hero-actions{margin-top:30px}}</style></head>
<body>
  <div class="cute-alert" id="cuteAlert"><div class="cute-face">(˶˃ ᵕ ˂˶)</div><strong>不要偷窥人家的隐私哎</strong><span>密码不对哦，再认真想一想 ✦</span></div>
  <section class="gate" id="gate"><div class="gate-card"><div class="gate-star">✦</div><p class="eyebrow">PRIVATE MEMORIES</p><h1>澜光相册</h1><p>照片将在当前设备中加密保存。输入密码，打开属于你的蓝色记忆。</p><input class="field" id="password" type="text" placeholder="输入相册密码（支持中文）" autocomplete="off" inputmode="text"><button class="btn" id="togglePassword" type="button">隐藏输入内容</button><button class="btn primary" id="unlock">进入相册</button><p class="message" id="gateMessage"></p></div></section>
  <header class="topbar"><a class="brand" href="../"><i>星</i><span>澜光相册</span></a><div class="top-actions"><button class="btn" id="exportBtn">导出加密备份</button><button class="btn" id="importBtn">导入备份</button><button class="btn primary" id="addBtn">＋ 添加照片</button><button class="btn danger" id="lockBtn">锁定</button></div></header>
  <main class="shell"><section class="hero hero-rich"><div class="hero-copy"><p class="eyebrow">MY PRIVATE ALBUM</p><h1>每一帧，<br><em>都是生活。</em></h1><div class="hero-actions"><button class="btn primary" id="heroAdd">＋ 添加照片</button><button class="btn" id="newAlbum">新建相册</button></div></div><div class="memory-scene" aria-hidden="true"><div class="memory-glow"></div><div class="memory-orb"><span>星</span><small>MEMORIES</small></div><div class="mini-card card-a"><b>今日微光</b><i>✦</i></div><div class="mini-card card-b"><b>生活有迹</b><i>♡</i></div></div><div class="hero-sparks" aria-hidden="true"><i>✦</i><i>·</i><i>✧</i><i>✦</i></div></section>
  <section class="section album-section"><p id="countText" hidden></p><select id="uploadAlbum" hidden></select><div class="album-tabs" id="tabs"></div><div class="empty" id="empty"><div><div class="empty-icon">☁</div><h3>把第一段回忆放进来</h3><p>点击“添加照片”，支持 JPG、PNG、WebP 与 GIF。</p></div></div><div class="grid hidden" id="grid"></div><p class="note">提示：这是面向中国大陆可访问的无服务器版本。照片仅保存在当前浏览器中；请定期使用“导出加密备份”，换电脑或清理浏览器前尤其需要备份。</p></section></main>
  <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden><input id="backupInput" type="file" accept="application/json,.json" hidden>
  <div class="modal hidden" id="modal"><button class="modal-close" id="modalClose">×</button><img id="preview" alt="照片预览"></div><div class="toast" id="toast"></div>
<script>
const DB_NAME='langlow-local-v1',STORE='photos',META='meta',SALT='langlow-baixing-2026';let db,key,active='all',albums=['生活','风景'];const $=s=>document.querySelector(s),te=new TextEncoder(),td=new TextDecoder();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore(STORE,{keyPath:'id'});d.createObjectStore(META)};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function derive(p){const base=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode(SALT),iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function verifier(k){const iv=new Uint8Array(12);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode('澜光相册'));return btoa(String.fromCharCode(...new Uint8Array(c)))}
async function encrypt(buf){const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf);return{iv:[...iv],cipher:[...new Uint8Array(cipher)]}}
async function decrypt(o){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(o.iv)},key,new Uint8Array(o.cipher))}
async function unlock(){try{db=await openDB();const p=$('#password').value;if(!p)return;const k=await derive(p),v=await verifier(k),expected='XGrdIJfjgg7SsV0S2KE2ogeCtRFwhNhOiIzDLg==';if(v!==expected)throw 0;tx(META,'readwrite').put(v,'verifier');key=k;albums=(await req(tx(META).get('albums')))||albums;$('#gate').classList.add('hidden');await render()}catch{const a=$('#cuteAlert');a.classList.remove('show');void a.offsetWidth;a.classList.add('show');$('#gateMessage').textContent='密码不对哦，再试一次～';$('#password').select()}}
async function allPhotos(){return (await req(tx(STORE).getAll())).sort((a,b)=>b.created-a.created)}
async function render(){const photos=await allPhotos(),shown=active==='all'?photos:photos.filter(p=>p.album===active);$('#tabs').innerHTML=['全部',...albums].map(n=>`<button class="tab ${active===(n==='全部'?'all':n)?'active':''}" data-album="${n==='全部'?'all':n}">${n}</button>`).join('');$('#uploadAlbum').innerHTML=albums.map(a=>`<option>${a}</option>`).join('');$('#countText').textContent=photos.length?`已经珍藏 ${photos.length} 个瞬间`:'从第一张照片开始';$('#empty').classList.toggle('hidden',shown.length>0);$('#grid').classList.toggle('hidden',!shown.length);$('#grid').innerHTML='';for(const p of shown){try{const buf=await decrypt(p.data),url=URL.createObjectURL(new Blob([buf],{type:p.type})),el=document.createElement('article');el.className='photo';el.innerHTML=`<img src="${url}" alt="${p.name}"><div class="photo-info">${p.album} · ${new Date(p.created).toLocaleDateString()}</div><button class="photo-delete" aria-label="删除照片">×</button>`;el.querySelector('img').onclick=()=>{$('#preview').src=url;$('#modal').classList.remove('hidden')};el.querySelector('button').onclick=async e=>{e.stopPropagation();if(confirm('确定删除这张照片吗？')){tx(STORE,'readwrite').delete(p.id);await render()}};$('#grid').append(el)}catch{}}
}
async function addFiles(files){for(const f of files){if(!f.type.startsWith('image/'))continue;const data=await encrypt(await f.arrayBuffer());tx(STORE,'readwrite').put({id:crypto.randomUUID(),name:f.name,type:f.type,album:$('#uploadAlbum').value||albums[0],created:Date.now(),data})}await render();toast('照片已加密保存')}
async function exportBackup(){const photos=await allPhotos(),payload={version:1,albums,photos,verifier:await req(tx(META).get('verifier'))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));a.download=`澜光相册备份-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('加密备份已导出')}
async function importBackup(f){try{const o=JSON.parse(await f.text());if(!Array.isArray(o.photos))throw 0;for(const p of o.photos)tx(STORE,'readwrite').put(p);albums=o.albums||albums;tx(META,'readwrite').put(albums,'albums');await render();toast('备份导入完成')}catch{toast('备份文件无效')}}
$('#unlock').onclick=unlock;$('#password').onkeydown=e=>{if(e.key==='Enter')unlock()};$('#togglePassword').onclick=()=>{const p=$('#password'),hidden=p.type==='password';p.type=hidden?'text':'password';$('#togglePassword').textContent=hidden?'隐藏输入内容':'显示输入内容';p.focus()};$('#addBtn').onclick=$('#heroAdd').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>addFiles(e.target.files);$('#tabs').onclick=e=>{const b=e.target.closest('[data-album]');if(b){active=b.dataset.album;render()}};$('#newAlbum').onclick=async()=>{const n=prompt('请输入新相册名称')?.trim();if(n&&!albums.includes(n)){albums.push(n);tx(META,'readwrite').put(albums,'albums');await render()}};$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#backupInput').click();$('#backupInput').onchange=e=>importBackup(e.target.files[0]);$('#lockBtn').onclick=()=>location.reload();$('#modalClose').onclick=()=>$('#modal').classList.add('hidden');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')};
</script></body></html>
